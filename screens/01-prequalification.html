<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>險種選擇 — 新安東京商用車險線上試算報價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/design-tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
  :root{
    --page-bg:#f5f7fb;
    --page-surface:#ffffff;
    --page-border:#dde4ee;
    --page-text:#232a2d;
    --page-text-muted:#5c6a70;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#12161b; --page-surface:#1b2129; --page-border:#2c3742;
      --page-text:#e8edf1; --page-text-muted:#95a5ad;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#12161b; --page-surface:#1b2129; --page-border:#2c3742;
    --page-text:#e8edf1; --page-text-muted:#95a5ad;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page-bg); color:var(--page-text);
    font-family:"Noto Sans TC","Roboto",sans-serif; font-size:var(--font-size-body-md); line-height:var(--line-height-body-md);
    display:flex; flex-direction:column; min-height:100vh;
  }
  .mono{font-family:"Roboto Mono",monospace;}
  .shell{max-width:880px; margin:0 auto; padding:0 24px; margin-bottom:24px; flex:1 0 auto; width:100%;}
  .stage-title{padding:26px 24px 4px;}
  .stage-title h1{font-size:var(--font-size-h1); line-height:var(--line-height-h1); margin:0 0 4px;}
  .stage-title p{font-size:var(--font-size-body-md); color:var(--page-text-muted); margin:0;}
  .date-row{display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end;}
  .arrow-sep{padding-bottom:9px; color:var(--neutral-400);}
  .plan-block{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .plan-block select{
    flex:1; font-family:inherit; font-size:var(--font-size-body-md); padding:9px 11px; border-radius:6px;
    border:1px solid var(--neutral-200); background:#fff; color:var(--page-text, #232a2d);
  }
  .plan-block select:focus{outline:none; border-color:var(--primary-500); box-shadow:0 0 0 3px var(--primary-100);}
  .plan-tag{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--neutral-100); color:var(--neutral-600); flex:none; white-space:nowrap;}
  .plan-remove{background:none; border:none; color:var(--neutral-400); cursor:pointer; font-size:14px; padding:4px 6px; flex:none; line-height:1;}
  .plan-remove:hover{color:var(--danger-600);}
  .taxi-radio-group{display:flex; gap:20px; margin-top:8px;}
  .taxi-radio-group label{display:flex; align-items:center; gap:6px; font-weight:400; font-size:var(--font-size-body-md); color:var(--page-text); cursor:pointer; white-space:nowrap;}
  .taxi-radio-group input:disabled + span{color:var(--neutral-400);}
  .date-group{transition:opacity .15s;}

  /* 證件對照預覽 lightbox */
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(20,24,28,.65); display:none;
    align-items:center; justify-content:center; z-index:200; padding:24px;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-panel{background:#fff; border-radius:12px; overflow:hidden; max-width:min(640px,90vw); max-height:90vh; display:flex; flex-direction:column;}
  .lightbox-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-size:var(--font-size-body-md); font-weight:600; border-bottom:1px solid var(--neutral-100);}
  .lightbox-close{background:none; border:none; font-size:16px; cursor:pointer; color:var(--neutral-500); padding:4px 8px; line-height:1;}
  .lightbox-close:hover{color:var(--neutral-800);}
  .lightbox-panel img{width:100%; height:auto; max-height:calc(90vh - 48px); object-fit:contain; display:block;}

  /* 1·險種選擇 ~ 保險生效日 統一包在同一張卡片內 */
  .stage-card{
    background:#fff; border:1px solid var(--neutral-200); border-radius:14px;
    margin-top:18px; overflow:hidden;
  }
  .stage-card .stage-title{padding:24px 24px 20px; margin:0;}
  .stage-card .form-section{
    background:none; border:none; border-radius:0; box-shadow:none;
    margin-bottom:0; padding:24px; position:relative;
  }
  /* 標題→第一個 section:滿版分隔線 */
  .stage-card .stage-title + .form-section{border-top:1px solid var(--neutral-100);}
  /* section 之間:內縮分隔線,左右與卡片邊框留 padding,不滿版 */
  .stage-card .form-section + .form-section::before{
    content:""; position:absolute; top:0; left:24px; right:24px;
    border-top:1px solid var(--neutral-100);
  }
</style>
</head>

  <script src="../design/header.js"></script>
  <script>
    function openLightbox(src, filename){
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxTitle').textContent = filename + ' — 證件對照預覽';
      document.getElementById('lightboxOverlay').classList.add('open');
    }
    function closeLightbox(){
      document.getElementById('lightboxOverlay').classList.remove('open');
    }
    /* ---- 上傳／OCR辨識(需按鈕觸發，不是上傳後自動辨識) ---- */
    /* 檔案格式白名單已由PRD確認為JPG/PNG/PDF；大小上限PRD 7.4自己尚未定案(見PO清單第4項)，此處10MB為示意值 */
    const UPLOAD_ALLOWED_TYPES = ['image/jpeg', 'image/png', 'application/pdf'];
    const UPLOAD_MAX_BYTES = 10 * 1024 * 1024;
    function onDropzoneClick(id){
      if(id === 'ocrDriver' && document.getElementById('assuredIsCorp').checked) return;
      const el = document.getElementById(id);
      if(el.dataset.state === 'empty'){
        document.getElementById(id+'File').click();
      } else {
        el.dataset.state = 'empty';
        renderDropzone(el);
        document.getElementById('ocrResultMsg').style.display = 'none';
        updateOcrState();
      }
    }
    function showUploadError(message){
      const el = document.getElementById('uploadErrorMsg');
      el.innerHTML = '<span class="ocr-status fail"><span>✕</span> '+message+'</span>';
      el.style.display = 'block';
    }
    function onFilePicked(id, inputEl){
      const file = inputEl.files[0];
      inputEl.value = '';
      if(!file) return;
      document.getElementById('uploadErrorMsg').style.display = 'none';
      if(UPLOAD_ALLOWED_TYPES.indexOf(file.type) === -1){
        showUploadError('僅支援 JPG／PNG／PDF 格式');
        return;
      }
      if(file.size > UPLOAD_MAX_BYTES){
        showUploadError('檔案大小不可超過 10MB，請壓縮後重新上傳');
        return;
      }
      const el = document.getElementById(id);
      el.dataset.state = 'uploaded';
      renderDropzone(el);
      document.getElementById('ocrResultMsg').style.display = 'none';
      updateOcrState();
    }
    function renderDropzone(el){
      const state = el.dataset.state, filename = el.dataset.filename,
            emptyText = el.dataset.emptyText, doneText = el.dataset.doneText, preview = el.dataset.preview;
      el.classList.toggle('pending', state === 'uploaded');
      el.classList.toggle('filled', state === 'recognized');
      if(state === 'empty'){
        el.innerHTML = '<div class="title">'+emptyText+'</div>';
      } else if(state === 'uploaded'){
        el.innerHTML = '<div class="thumb"><img src="'+preview+'" alt="'+filename+' 證件對照預覽" onclick="event.stopPropagation(); openLightbox(\''+preview+'\',\''+filename+'\')"></div><div><div class="title">'+filename+'</div><div class="ocr-status" style="background:var(--neutral-100); color:var(--neutral-600);">待辨識</div></div>';
      } else {
        el.innerHTML = '<div class="thumb"><img src="'+preview+'" alt="'+filename+' 證件對照預覽" onclick="event.stopPropagation(); openLightbox(\''+preview+'\',\''+filename+'\')"></div><div><div class="title"><span class="ocr-check-icon">✓</span>'+filename+'</div></div>';
      }
    }
    /* 依序循環示範三種結果:成功／逾時(>5秒)／辨識失敗,對應PRD情境表 */
    let ocrAttempt = 0;
    const OCR_OUTCOMES = ['success','timeout','fail'];
    function runOcr(){
      const outcome = OCR_OUTCOMES[ocrAttempt % OCR_OUTCOMES.length];
      ocrAttempt++;
      const pendingIds = ['ocrLicense','ocrDriver'].filter(function(id){ return document.getElementById(id).dataset.state === 'uploaded'; });
      const msgEl = document.getElementById('ocrResultMsg');
      if(outcome === 'success'){
        const doneTexts = [];
        pendingIds.forEach(function(id){
          const el = document.getElementById(id);
          el.dataset.state = 'recognized';
          renderDropzone(el);
          doneTexts.push(el.dataset.doneText);
          if(id === 'ocrLicense'){
            document.getElementById('plateFront').value = el.dataset.plateFront;
            document.getElementById('plateRear').value = el.dataset.plateRear;
          } else if(id === 'ocrDriver'){
            document.getElementById('driverIdNo').value = el.dataset.driverId;
          }
        });
        msgEl.innerHTML = doneTexts.map(function(t){ return '<span class="ocr-status done" style="margin-right:8px;"><span>✓</span> '+t+'</span>'; }).join('');
        msgEl.style.display = 'flex';
      } else if(outcome === 'timeout'){
        msgEl.innerHTML = '<span class="ocr-status warn"><span>⚠</span> 辨識服務忙碌，請稍後重試或手動輸入</span>';
        msgEl.style.display = 'flex';
      } else {
        msgEl.innerHTML = '<span class="ocr-status fail"><span>✕</span> 辨識失敗，請重新上傳清晰圖檔或手動輸入</span>';
        msgEl.style.display = 'flex';
      }
      updateOcrState();
    }
    function updateOcrState(){
      const ids = ['ocrLicense','ocrDriver'];
      const anyPending = ids.some(function(id){ return document.getElementById(id).dataset.state === 'uploaded'; });
      document.getElementById('ocrTriggerBtn').disabled = !anyPending;
      checkBrandLookupTrigger();
    }
    /* PRD v2.5:廠代碼工具由「牌照號碼」+「駕照號碼(身分證)/統一編號」共同觸發(不論是OCR代入或手動輸入)，
       不是像v2.2那樣只要任一項OCR辨識成功就觸發 */
    function checkBrandLookupTrigger(){
      const busyEl = document.getElementById('ocrBusy');
      const ready = document.getElementById('plateFront').value.trim() &&
                    document.getElementById('plateRear').value.trim() &&
                    document.getElementById('driverIdNo').value.trim();
      busyEl.style.display = ready ? 'inline-flex' : 'none';
      if(ready && !busyEl.classList.contains('fail')){ setLookupState(busyEl, 'done'); }
    }
    function onAssuredIsCorpChange(){
      const isCorp = document.getElementById('assuredIsCorp').checked;
      const driverDropzone = document.getElementById('ocrDriver');
      const driverIdInput = document.getElementById('driverIdNo');
      const driverIdLabel = document.getElementById('driverIdLabel');
      driverDropzone.style.opacity = isCorp ? '.45' : '1';
      driverDropzone.style.pointerEvents = isCorp ? 'none' : 'auto';
      if(isCorp && driverDropzone.dataset.state !== 'empty'){
        driverDropzone.dataset.state = 'empty';
        renderDropzone(driverDropzone);
      }
      driverIdLabel.innerHTML = isCorp
        ? '統一編號 <span class="req">*</span>'
        : '駕照號碼（身分證） <span class="req">*</span>';
      driverIdInput.value = '';
      driverIdInput.placeholder = isCorp ? '請輸入統一編號（8碼）' : '';
      updateOcrState();
    }
    function setLookupState(el, state){
      if(state === 'fail'){
        el.className = 'ocr-status fail';
        el.innerHTML = '<span>✕</span> 查無此廠牌車型資料，請確認車牌後手動填寫';
      } else if(state === 'done'){
        el.className = 'ocr-status done';
        el.innerHTML = '<span>✓</span> 廠代碼工具查詢成功，資料已代入';
      } else {
        el.className = 'ocr-status busy';
        el.innerHTML = '<span class="spin"></span> 廠代碼工具查詢中…';
      }
    }
    function toggleLookupFail(){
      const el = document.getElementById('ocrBusy');
      const isFail = el.classList.contains('fail');
      setLookupState(el, isFail ? 'done' : 'fail');
    }

    /* ---- T牌種類跟車輛種類代號連動:非07/15時鎖定「不適用」;選21時彈窗阻擋 ---- */
    function updateTaxiOptions(){
      const vt = document.getElementById('vehicleType').value;
      const eligible = (vt === '07' || vt === '15');
      const n = document.getElementById('taxiN'), y = document.getElementById('taxiY'), na = document.getElementById('taxiNA');
      n.disabled = !eligible; y.disabled = !eligible; na.disabled = eligible;
      if(!eligible){ na.checked = true; }
      else if(na.checked){ n.checked = true; }
    }
    function onVehicleTypeChange(){
      updateTaxiOptions();
      const vt = document.getElementById('vehicleType').value;
      if(vt === '21'){
        document.getElementById('vehicleTypeBlockModal').classList.add('open');
      }
      updateNextBtnState();
    }

    /* ---- 送出預查:通過後「下一步」才可點擊,對應PRD 9.3「預查通過後可進入下一步」情境 ---- */
    let prequalPassed = false;
    function updateNextBtnState(){
      const vt = document.getElementById('vehicleType').value;
      document.getElementById('nextBtn').disabled = !prequalPassed || vt === '21';
    }
    function validatePrequalForm(){
      let ok = true;
      ['plateFrontField', 'plateRearField', 'driverIdField'].forEach(clearFieldError);
      if(!document.getElementById('plateFront').value.trim()){ setFieldError('plateFrontField', '請輸入車牌前段'); ok = false; }
      if(!document.getElementById('plateRear').value.trim()){ setFieldError('plateRearField', '請輸入車牌後段'); ok = false; }
      if(!document.getElementById('driverIdNo').value.trim()){ setFieldError('driverIdField', '請輸入駕照號碼（身分證）'); ok = false; }
      if(document.getElementById('compelBeginField').classList.contains('error')) ok = false;
      if(document.getElementById('choiceBeginField').classList.contains('error')) ok = false;
      return ok;
    }
    function submitPrequal(){
      const msgEl = document.getElementById('prequalResultMsg');
      if(!validatePrequalForm()){
        msgEl.style.display = 'none';
        prequalPassed = false;
        updateNextBtnState();
        return;
      }
      prequalPassed = true;
      msgEl.innerHTML = '<span class="pv-tag tag-success"><span class="dot"></span>預查通過</span>';
      msgEl.style.display = 'block';
      updateNextBtnState();
    }

    /* ---- 方案清冊:最多3組,各自一個Dropdown選PlanCode ---- */
    let planBlockCount = 1;
    const PLAN_OPTIONS = '<option value="">請選擇方案</option>'
      + '<option value="強+任">T15-100200-300　強制險＋任意險（示例方案 A）</option>'
      + '<option value="單強">T15-21　單一強制險（示例方案 B）</option>'
      + '<option value="單任">T15-300-10000-1　單一任意險（示例方案 C）</option>';
    function addPlanBlock(){
      if(planBlockCount >= 3) return;
      planBlockCount++;
      const wrapper = document.createElement('div');
      wrapper.className = 'plan-block';
      wrapper.innerHTML = '<select class="plan-select" onchange="updatePlanTag(this)">'+PLAN_OPTIONS+'</select><span class="plan-tag" style="display:none;"></span><button class="plan-remove" onclick="removePlanBlock(this)" aria-label="移除方案">✕</button>';
      document.getElementById('planBlocks').appendChild(wrapper);
      updatePlanBlocksUI();
      updateDateRequirements();
    }
    function removePlanBlock(btn){
      btn.closest('.plan-block').remove();
      planBlockCount--;
      updatePlanBlocksUI();
      updateDateRequirements();
    }
    function updatePlanBlocksUI(){
      document.getElementById('addPlanBtn').style.display = (planBlockCount >= 3) ? 'none' : 'inline-flex';
      document.querySelectorAll('.plan-remove').forEach(function(b){ b.style.display = (planBlockCount > 1) ? 'inline-flex' : 'none'; });
    }
    function updatePlanTag(sel){
      const opt = sel.selectedOptions[0];
      const tagEl = sel.nextElementSibling;
      if(opt && opt.value){ tagEl.textContent = opt.value; tagEl.style.display = 'inline-flex'; }
      else { tagEl.style.display = 'none'; }
      updateDateRequirements();
    }

    /* ---- 生效日依選擇的方案是否含強制/任意險決定是否需要 ---- */
    function updateDateRequirements(){
      const tags = [].slice.call(document.querySelectorAll('.plan-select')).map(function(s){ return s.value; }).filter(Boolean);
      setDatePairState('compel', tags.some(function(t){ return t === '強+任' || t === '單強'; }));
      setDatePairState('choice', tags.some(function(t){ return t === '強+任' || t === '單任'; }));
      onEffectiveDateChange('compel');
      onEffectiveDateChange('choice');
    }
    function setDatePairState(prefix, needed){
      document.getElementById(prefix+'Begin').disabled = !needed;
      document.getElementById(prefix+'DateGroup').style.opacity = needed ? '1' : '.45';
    }

    /* ---- 生效日驗證:當日不可選/不得早於系統日/需在60天內(對應PO清單第5項採60天版本) ---- */
    const DATE_MAX_DAYS_AHEAD = 60;
    function toDateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function formatDate(d){
      const p = function(n){ return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }
    function addYears(d, n){ const r = new Date(d); r.setFullYear(r.getFullYear() + n); return r; }

    function setFieldError(fieldId, message){
      const field = document.getElementById(fieldId);
      field.classList.add('error');
      if(!field.querySelector('.err-msg')){
        field.insertAdjacentHTML('beforeend', '<div class="err-msg">⚠ '+message+'</div>');
      }
    }
    function clearFieldError(fieldId){
      const field = document.getElementById(fieldId);
      field.classList.remove('error');
      const msg = field.querySelector('.err-msg');
      if(msg) msg.remove();
    }

    function onEffectiveDateChange(prefix){
      const beginInput = document.getElementById(prefix+'Begin');
      const endInput = document.getElementById(prefix+'End');
      const fieldId = prefix+'BeginField';
      clearFieldError(fieldId);
      if(beginInput.disabled || !beginInput.value) return;

      const today = toDateOnly(new Date());
      const begin = toDateOnly(new Date(beginInput.value + 'T00:00:00'));

      if(begin.getTime() === today.getTime()){
        setFieldError(fieldId, '保險生效日不可為當日');
        endInput.value = '';
        return;
      }
      if(begin.getTime() < today.getTime()){
        setFieldError(fieldId, '生效日不得小於系統日');
        endInput.value = '';
        return;
      }
      const diffDays = Math.round((begin.getTime() - today.getTime()) / 86400000);
      if(diffDays > DATE_MAX_DAYS_AHEAD){
        setFieldError(fieldId, '保險生效日需為60天內');
        endInput.value = '';
        return;
      }
      endInput.value = formatDate(addYears(begin, 1));
    }

    function initEffectiveDates(){
      const today = toDateOnly(new Date());
      const min = formatDate(addDays(today, 1));
      const max = formatDate(addDays(today, DATE_MAX_DAYS_AHEAD));
      const demoDefault = formatDate(addDays(today, 7));
      ['compelBegin', 'choiceBegin'].forEach(function(id){
        const input = document.getElementById(id);
        input.min = min;
        input.max = max;
        input.value = demoDefault;
      });
      onEffectiveDateChange('compel');
      onEffectiveDateChange('choice');
    }

    updateOcrState();
    updatePlanBlocksUI();
    updateDateRequirements();
    initEffectiveDates();
    updateNextBtnState();
  </script>
</body>
</html>
