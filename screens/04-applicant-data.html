<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>要保人資料 — 新安東京商用車險線上試算報價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/design-tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
  :root{
    --page-bg:#f5f7fb;
    --page-surface:#ffffff;
    --page-border:#dde4ee;
    --page-text:#232a2d;
    --page-text-muted:#5c6a70;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#12161b; --page-surface:#1b2129; --page-border:#2c3742;
      --page-text:#e8edf1; --page-text-muted:#95a5ad;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#12161b; --page-surface:#1b2129; --page-border:#2c3742;
    --page-text:#e8edf1; --page-text-muted:#95a5ad;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page-bg); color:var(--page-text);
    font-family:"Noto Sans TC","Roboto",sans-serif; font-size:var(--font-size-body-md); line-height:var(--line-height-body-md);
    display:flex; flex-direction:column; min-height:100vh;
  }
  .shell{max-width:880px; margin:0 auto; padding:0 24px; margin-bottom:24px; flex:1 0 auto; width:100%;}
  .stage-title{padding:26px 24px 4px;}
  .stage-title h1{font-size:var(--font-size-h1); line-height:var(--line-height-h1); margin:0 0 4px;}
  .stage-title p{font-size:var(--font-size-body-md); color:var(--page-text-muted); margin:0;}

  .stage-card{
    background:#fff; border:1px solid var(--neutral-200); border-radius:14px;
    margin-top:18px; overflow:hidden;
  }
  .stage-card .stage-title{padding:24px 24px 20px; margin:0;}
  .stage-card .form-section{
    background:none; border:none; border-radius:0; box-shadow:none;
    margin-bottom:0; padding:24px; position:relative;
  }
  .stage-card .stage-title + .form-section{border-top:1px solid var(--neutral-100);}
  .stage-card .form-section + .form-section::before{
    content:""; position:absolute; top:0; left:24px; right:24px;
    border-top:1px solid var(--neutral-100);
  }
  .check-label{display:flex; align-items:center; gap:8px; font-size:var(--font-size-body-md); color:var(--page-text); cursor:pointer;}
  .check-label input{width:16px; height:16px; accent-color:var(--primary-600);}
</style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <img src="../design/assets/logo-horizontal-light.svg" alt="羅賓斯保險代理人">
    </div>
    <div class="user">
      <div class="user-trigger" onclick="toggleAccountMenu()">
        <div class="user-text">
          <div class="user-email">wang.xm@stockfeel.com.tw</div>
          <div class="user-role">業務人員</div>
        </div>
        <div class="avatar">王</div>
      </div>
      <div class="account-menu" id="accountMenu">
        <a class="account-menu-item" href="case-overview.html">案件總覽</a>
        <a class="account-menu-item" href="00-login.html">登出</a>
      </div>
    </div>
  </header>

  <div class="shell">

    <div class="stepper" aria-label="投保流程階段">
      <div class="step done"><div class="circle">✓</div><div class="label">險種選擇</div></div>
      <div class="step-line done"></div>
      <div class="step done"><div class="circle">✓</div><div class="label">車輛資料</div></div>
      <div class="step-line done"></div>
      <div class="step done"><div class="circle">✓</div><div class="label">被保險人資料</div></div>
      <div class="step-line done"></div>
      <div class="step current"><div class="circle">4</div><div class="label">要保人資料</div></div>
      <div class="step-line"></div>
      <div class="step todo"><div class="circle">5</div><div class="label">KYC 及其他</div></div>
      <div class="step-line"></div>
      <div class="step todo"><div class="circle">6</div><div class="label">審查與下載</div></div>
    </div>

    <div class="stage-card">
    <div class="stage-title">
      <h1><span style="font-family:'Roboto',sans-serif;">4.</span> 要保人資料</h1>
      <p>若與被保險人為同一人，可一鍵代入被保險人資料；若為不同人，請依實際要保人資訊填寫。</p>
    </div>

    <div class="form-section">
      <h3>與被保險人關係</h3>
      <label class="check-label">
        <input type="checkbox" id="sameAsAssured" checked onchange="toggleSameAsAssured()">
        <span>要保人與被保險人為同一人</span>
      </label>
      <div class="fields-row" style="margin-top:16px;">
        <div class="field" id="relationField">
          <label>與被保險人關係 <span class="req">*</span></label>
          <select id="relationDesc" onchange="onRelationChange()" disabled>
            <option value="本人">本人</option>
            <option value="配偶">配偶</option>
            <option value="父母">父母</option>
            <option value="子女">子女</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="field" id="relationNoteField" style="display:none;">
          <label>關係補充說明 <span class="req">*</span></label>
          <input type="text" id="relationNote" maxlength="30">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>基本資料</h3>
      <div class="field">
        <label>要保人性質 <span class="req">*</span></label>
        <div class="option-row">
          <label><input type="radio" name="applicantType" id="applicantTypeNatural" checked onchange="onApplicantTypeChange()" disabled><span>國內自然人</span></label>
          <label><input type="radio" name="applicantType" id="applicantTypeCorp" onchange="onApplicantTypeChange()" disabled><span>國內法人</span></label>
        </div>
      </div>
      <div class="fields-row" style="margin-top:16px;">
        <div class="field" id="applicantIdField">
          <label id="applicantIdLabel">要保人ID（身分證） <span class="req">*</span></label>
          <input type="text" id="applicantId" maxlength="10" oninput="onApplicantIdInput()">
        </div>
        <div class="field" id="applicantNameField">
          <label id="applicantNameLabel">姓名 <span class="req">*</span></label>
          <input type="text" id="applicantName" maxlength="50">
        </div>
      </div>
      <div class="fields-row" id="applicantNaturalOnlyFields" style="margin-top:16px;">
        <div class="field" id="applicantBirthdayField">
          <label>生日 <span class="req">*</span></label>
          <input type="date" id="applicantBirthday">
        </div>
        <div class="field" id="applicantSexField">
          <label>性別（唯讀，依身分證自動判斷）</label>
          <input type="text" id="applicantSex" readonly>
        </div>
      </div>
      <div class="field" id="applicantDeputyField" style="margin-top:16px; display:none;">
        <label>法人代表人 <span class="req">*</span></label>
        <input type="text" id="applicantDeputy" maxlength="25">
      </div>
    </div>

    <div class="form-section">
      <h3>聯絡資訊</h3>
      <div class="fields-row">
        <div class="field">
          <label>縣市 <span class="req">*</span></label>
          <select id="applicantCity" onchange="updateApplicantDistrict()"></select>
        </div>
        <div class="field">
          <label>鄉鎮市區 <span class="req">*</span></label>
          <select id="applicantDistrict" onchange="updateApplicantZip()"></select>
        </div>
        <div class="field readonly">
          <label>郵遞區號（唯讀）</label>
          <input type="text" id="applicantZip" readonly>
        </div>
      </div>
      <div class="field" id="applicantDetailField" style="margin-top:16px;">
        <label>詳細地址 <span class="req">*</span></label>
        <input type="text" id="applicantDetail">
      </div>
      <div class="fields-row" style="margin-top:16px;">
        <div class="field">
          <label>Email</label>
          <input type="email" id="applicantEmail" maxlength="50">
        </div>
        <div class="field" id="applicantMobileField">
          <label>手機號碼 <span class="req">*</span></label>
          <input type="text" id="applicantMobile" placeholder="09xx-xxx-xxx">
        </div>
        <div class="field">
          <label>聯繫電話</label>
          <input type="text" id="applicantTel" placeholder="02-88727777">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>其他資訊</h3>
      <div class="field">
        <label>職業別 <span class="req">*</span></label>
        <div class="option-row">
          <label><input type="radio" name="applicantOccupy" id="applicantOccupyN" checked onchange="onApplicantOccupyChange()"><span>一般職</span></label>
          <label><input type="radio" name="applicantOccupy" id="applicantOccupyY" onchange="onApplicantOccupyChange()"><span>非一般職</span></label>
        </div>
      </div>
      <div class="field" id="applicantOccupyCodeField" style="display:none; margin-top:16px; max-width:400px;">
        <label>高風險職業代號 <span class="req">*</span></label>
        <select id="applicantOccupyCode">
          <option value="">請選擇</option>
          <option value="001">001 律師</option>
          <option value="002">002 會計師</option>
          <option value="003">003 公證人</option>
          <option value="004">004 軍火商、不動產經紀業</option>
          <option value="005">005 融資從業人員</option>
          <option value="008">008 提供虛擬資產服務之事業或人員</option>
          <option value="010">010 銀樓業</option>
          <option value="011">011 藝術品拍賣業</option>
          <option value="015">015 博弈產業/公司</option>
          <option value="018">018 辦理儲金匯兌之郵政機構</option>
          <option value="019">019 國際金融業務分行（OBU）</option>
          <option value="020">020 國際證券業務分公司（OSU）</option>
          <option value="021">021 國際保險業務分公司（OIU）</option>
          <option value="022">022 證券商</option>
          <option value="023">023 提供第三方支付服務之事業或人員</option>
          <option value="024">024 外國銀行在臺分行</option>
          <option value="025">025 本國銀行</option>
          <option value="026">026 人壽保險公司</option>
          <option value="027">027 農業金融機構（含全國農業金庫、農會信用部及漁會信用部）</option>
        </select>
      </div>
      <div class="fields-row" style="margin-top:16px;">
        <div class="field">
          <label>國別註記 <span class="req">*</span></label>
          <select id="applicantCntry" onchange="onApplicantCntryChange()">
            <option value="9" selected>9 本國人</option>
            <option value="1">1 高風險國家</option>
            <option value="2">2 大陸人士(不含港澳)</option>
            <option value="3">3 歐盟國家</option>
            <option value="4">4 加強監督國家及地區</option>
            <option value="5">5 經濟制裁國家</option>
            <option value="8">8 其他</option>
          </select>
        </div>
        <div class="field" id="applicantCntryNameField" style="display:none;">
          <label>國別名稱 <span class="req">*</span></label>
          <input type="text" id="applicantCntryName" maxlength="25">
        </div>
      </div>
    </div>
    </div>

    <div id="submitResultMsg" style="margin:16px 2px 0; display:none;"></div>

  </div>

  <div class="page-actions">
    <div class="page-actions-inner">
      <button class="pv-btn outlined" onclick="location.href='03-insured-data.html'">上一步</button>
      <button class="pv-btn primary" onclick="handleSubmit()">下一步：KYC 及其他</button>
    </div>
  </div>

  <script src="../design/header.js"></script>
  <script>
    /* ---- 被保險人(階段3)的示意資料,用於「一鍵代入」demo ---- */
    const ASSURED_DEMO = {
      id: 'A123456789', name: '王小明', birthday: '1990-05-20',
      city: '台北市', district: '大安區', detail: '忠孝東路四段1號',
      mobile: '0912-345-678'
    };

    /* ---- 地址連動:縣市→鄉鎮市區→自動代入郵遞區號(示意資料,與階段3共用同一份demo資料) ---- */
    const ADDRESS_DATA = {
      '台北市': { '大安區':'106', '信義區':'110', '中山區':'104' },
      '新北市': { '板橋區':'220', '三重區':'241' }
    };
    function initApplicantAddressOptions(){
      const citySel = document.getElementById('applicantCity');
      citySel.innerHTML = Object.keys(ADDRESS_DATA).map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
      updateApplicantDistrict();
    }
    function updateApplicantDistrict(){
      const city = document.getElementById('applicantCity').value;
      const districts = ADDRESS_DATA[city];
      document.getElementById('applicantDistrict').innerHTML = Object.keys(districts).map(function(d){ return '<option value="'+d+'">'+d+'</option>'; }).join('');
      updateApplicantZip();
    }
    function updateApplicantZip(){
      const city = document.getElementById('applicantCity').value;
      const district = document.getElementById('applicantDistrict').value;
      document.getElementById('applicantZip').value = ADDRESS_DATA[city][district] || '';
    }

    /* ---- 要保人性質:自然人/法人動態顯示欄位 ---- */
    function onApplicantTypeChange(){
      const isCorp = document.getElementById('applicantTypeCorp').checked;
      document.getElementById('applicantNaturalOnlyFields').style.display = isCorp ? 'none' : 'flex';
      document.getElementById('applicantDeputyField').style.display = isCorp ? 'block' : 'none';
      document.getElementById('applicantIdLabel').innerHTML = (isCorp ? '要保人ID（統一編號）' : '要保人ID（身分證）') + ' <span class="req">*</span>';
      document.getElementById('applicantNameLabel').innerHTML = (isCorp ? '公司名稱' : '姓名') + ' <span class="req">*</span>';
      document.getElementById('applicantId').maxLength = isCorp ? 8 : 10;
    }

    /* ---- 身分證檢核演算法(與階段3相同) ---- */
    const ID_LETTER_VALUE = {A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33};
    function isValidTaiwanId(id){
      if(!/^[A-Z][1289][0-9]{8}$/.test(id)) return false;
      const v = ID_LETTER_VALUE[id[0]];
      const d1 = Math.floor(v/10), d2 = v%10;
      const n = id.slice(1).split('').map(Number);
      const weights = [8,7,6,5,4,3,2,1,1];
      let sum = d1*1 + d2*9;
      for(let i=0;i<9;i++){ sum += n[i]*weights[i]; }
      return sum % 10 === 0;
    }
    function onApplicantIdInput(){
      const isCorp = document.getElementById('applicantTypeCorp').checked;
      if(isCorp) return;
      const id = document.getElementById('applicantId').value.toUpperCase();
      const sexField = document.getElementById('applicantSex');
      if(isValidTaiwanId(id)){
        const genderDigit = id[1];
        sexField.value = (genderDigit === '1' || genderDigit === '8') ? '男' : '女';
      } else {
        sexField.value = '';
      }
    }

    /* ---- 職業別:非一般職才顯示且必填高風險代號 ---- */
    function onApplicantOccupyChange(){
      const isHighRisk = document.getElementById('applicantOccupyY').checked;
      const field = document.getElementById('applicantOccupyCodeField');
      field.style.display = isHighRisk ? 'block' : 'none';
      if(!isHighRisk){
        document.getElementById('applicantOccupyCode').value = '';
        field.classList.remove('error');
      }
    }

    /* ---- 國別註記選「其他」才顯示國別名稱 ---- */
    function onApplicantCntryChange(){
      const isOther = document.getElementById('applicantCntry').value === '8';
      const field = document.getElementById('applicantCntryNameField');
      field.style.display = isOther ? 'block' : 'none';
      if(!isOther){
        document.getElementById('applicantCntryName').value = '';
        field.classList.remove('error');
      }
    }

    /* ---- 與被保險人關係:選「其他」才顯示且必填補充說明 ---- */
    function onRelationChange(){
      const isOther = document.getElementById('relationDesc').value === '其他';
      const field = document.getElementById('relationNoteField');
      field.style.display = isOther ? 'block' : 'none';
      if(!isOther){
        document.getElementById('relationNote').value = '';
        field.classList.remove('error');
      }
    }

    /* ---- 與被保險人同一人:勾選時一鍵代入階段3示意資料且鎖定性質/關係;取消則清空並改用系統預設值 ---- */
    function toggleSameAsAssured(){
      const same = document.getElementById('sameAsAssured').checked;
      const relationSel = document.getElementById('relationDesc');
      const typeNatural = document.getElementById('applicantTypeNatural');
      const typeCorp = document.getElementById('applicantTypeCorp');

      typeNatural.disabled = same;
      typeCorp.disabled = same;
      relationSel.disabled = same;

      if(same){
        typeNatural.checked = true;
        onApplicantTypeChange();
        document.getElementById('applicantId').value = ASSURED_DEMO.id;
        document.getElementById('applicantName').value = ASSURED_DEMO.name;
        document.getElementById('applicantBirthday').value = ASSURED_DEMO.birthday;
        document.getElementById('applicantCity').value = ASSURED_DEMO.city;
        updateApplicantDistrict();
        document.getElementById('applicantDistrict').value = ASSURED_DEMO.district;
        updateApplicantZip();
        document.getElementById('applicantDetail').value = ASSURED_DEMO.detail;
        document.getElementById('applicantEmail').value = '';
        document.getElementById('applicantMobile').value = ASSURED_DEMO.mobile;
        document.getElementById('applicantTel').value = '';
        document.getElementById('applicantOccupyN').checked = true;
        onApplicantOccupyChange();
        document.getElementById('applicantCntry').value = '9';
        onApplicantCntryChange();
        relationSel.value = '本人';
        onRelationChange();
      } else {
        typeNatural.checked = true;
        onApplicantTypeChange();
        document.getElementById('applicantId').value = '';
        document.getElementById('applicantName').value = '';
        document.getElementById('applicantBirthday').value = '';
        document.getElementById('applicantDetail').value = '';
        document.getElementById('applicantEmail').value = '';
        document.getElementById('applicantMobile').value = '';
        document.getElementById('applicantTel').value = '';
        document.getElementById('applicantOccupyN').checked = true;
        onApplicantOccupyChange();
        document.getElementById('applicantCntry').value = '9';
        onApplicantCntryChange();
        relationSel.value = '';
        onRelationChange();
      }
      onApplicantIdInput();
    }

    /* ---- 送出前端驗證 ---- */
    function setFieldError(fieldId, message){
      const field = document.getElementById(fieldId);
      field.classList.add('error');
      if(!field.querySelector('.err-msg')){
        field.insertAdjacentHTML('beforeend', '<div class="err-msg">⚠ '+message+'</div>');
      }
    }
    function clearFieldError(fieldId){
      const field = document.getElementById(fieldId);
      field.classList.remove('error');
      const msg = field.querySelector('.err-msg');
      if(msg) msg.remove();
    }
    function validateForm(){
      let ok = true;
      const isCorp = document.getElementById('applicantTypeCorp').checked;

      ['applicantIdField','applicantNameField','applicantDeputyField','applicantDetailField','applicantMobileField','applicantOccupyCodeField','applicantCntryNameField','relationField','relationNoteField'].forEach(clearFieldError);

      if(!document.getElementById('applicantMobile').value.trim()){
        setFieldError('applicantMobileField', '請輸入要保人手機號碼'); ok = false;
      }
      const idVal = document.getElementById('applicantId').value.trim();
      if(!idVal){
        setFieldError('applicantIdField', '請輸入要保人ID'); ok = false;
      } else if(!isCorp && !isValidTaiwanId(idVal.toUpperCase())){
        setFieldError('applicantIdField', '要保人ID錯誤'); ok = false;
      } else if(isCorp && !/^[0-9]{8}$/.test(idVal)){
        setFieldError('applicantIdField', '要保人ID錯誤'); ok = false;
      }
      if(!document.getElementById('applicantName').value.trim()){
        setFieldError('applicantNameField', '請輸入要保人姓名'); ok = false;
      }
      if(isCorp && !document.getElementById('applicantDeputy').value.trim()){
        setFieldError('applicantDeputyField', '請輸入法人代表人'); ok = false;
      }
      if(!document.getElementById('applicantDetail').value.trim()){
        setFieldError('applicantDetailField', '請輸入通訊地址'); ok = false;
      }
      if(document.getElementById('applicantOccupyY').checked && !document.getElementById('applicantOccupyCode').value){
        setFieldError('applicantOccupyCodeField', '要保人為非一般職／行業別時，請輸入高風險職業代碼'); ok = false;
      }
      if(document.getElementById('applicantCntry').value === '8' && !document.getElementById('applicantCntryName').value.trim()){
        setFieldError('applicantCntryNameField', '請輸入國別名稱'); ok = false;
      }
      const relation = document.getElementById('relationDesc').value;
      if(!relation){
        setFieldError('relationField', '請選擇與被保險人關係'); ok = false;
      } else if(relation === '其他' && !document.getElementById('relationNote').value.trim()){
        setFieldError('relationNoteField', '請填寫關係補充說明'); ok = false;
      }
      /* PRD情境:關係非本人但兩者ID相同(E0020) / 關係本人但ID不同(E0017)。
         這兩個錯誤代碼在API規格v1.3/1.4的異動紀錄中被標記過刪除線(可能已停用)，
         但PRD 6.4自己的情境表仍要求做這兩條檢核，故先依PRD實作，列為已知阻礙項待確認。 */
      if(idVal){
        const sameId = idVal.toUpperCase() === ASSURED_DEMO.id;
        if(relation && relation !== '本人' && sameId){
          setFieldError('relationField', '要保人與被保人的關係描述請回傳［本人］'); ok = false;
        } else if(relation === '本人' && !sameId){
          setFieldError('applicantIdField', '要保人與被保險人資料不相符'); ok = false;
        }
      }

      if(!isCorp){
        const birthday = document.getElementById('applicantBirthday').value;
        if(!birthday){
          setFieldError('applicantBirthdayField', '請輸入要保人生日'); ok = false;
        }
        if(!document.getElementById('applicantSex').value){
          setFieldError('applicantSexField', '請輸入要保人性別'); ok = false;
        }
      }

      return ok;
    }

    function handleSubmit(){
      const msgEl = document.getElementById('submitResultMsg');
      if(!validateForm()){
        msgEl.style.display = 'none';
        return;
      }
      msgEl.innerHTML = '<span class="pv-tag tag-success"><span class="dot"></span>資料驗證通過</span>';
      msgEl.style.display = 'block';
      setTimeout(function(){ location.href = '05-kyc-other.html'; }, 500);
    }

    initApplicantAddressOptions();
    toggleSameAsAssured();
  </script>
</body>
</html>
