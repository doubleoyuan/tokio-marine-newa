<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC 及其他 — 新安東京商用車險線上試算報價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/design-tokens.css">
<link rel="stylesheet" href="../design/components.css">
<style>
  :root{
    --page-bg:#f5f7fb;
    --page-surface:#ffffff;
    --page-border:#dde4ee;
    --page-text:#232a2d;
    --page-text-muted:#5c6a70;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#12161b; --page-surface:#1b2129; --page-border:#2c3742;
      --page-text:#e8edf1; --page-text-muted:#95a5ad;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#12161b; --page-surface:#1b2129; --page-border:#2c3742;
    --page-text:#e8edf1; --page-text-muted:#95a5ad;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page-bg); color:var(--page-text);
    font-family:"Noto Sans TC","Roboto",sans-serif; font-size:var(--font-size-body-md); line-height:var(--line-height-body-md);
    display:flex; flex-direction:column; min-height:100vh;
  }
  .shell{max-width:880px; margin:0 auto; padding:0 24px; margin-bottom:24px; flex:1 0 auto; width:100%;}
  .stage-title{padding:26px 24px 4px;}
  .stage-title h1{font-size:var(--font-size-h1); line-height:var(--line-height-h1); margin:0 0 4px;}
  .stage-title p{font-size:var(--font-size-body-md); color:var(--page-text-muted); margin:0;}

  .stage-card{
    background:#fff; border:1px solid var(--neutral-200); border-radius:14px;
    margin-top:18px; overflow:hidden;
  }
  .stage-card .stage-title{padding:24px 24px 20px; margin:0;}
  .stage-card .form-section{
    background:none; border:none; border-radius:0; box-shadow:none;
    margin-bottom:0; padding:24px; position:relative;
  }
  .stage-card .stage-title + .form-section{border-top:1px solid var(--neutral-100);}
  .stage-card .form-section + .form-section::before{
    content:""; position:absolute; top:0; left:24px; right:24px;
    border-top:1px solid var(--neutral-100);
  }
  .attach-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:640px){ .attach-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <img src="../design/assets/logo-horizontal-light.svg" alt="羅賓斯保險代理人">
    </div>
    <div class="user">
      <div class="user-trigger" onclick="toggleAccountMenu()">
        <div class="user-text">
          <div class="user-email">wang.xm@stockfeel.com.tw</div>
          <div class="user-role">業務人員</div>
        </div>
        <div class="avatar">王</div>
      </div>
      <div class="account-menu" id="accountMenu">
        <a class="account-menu-item" href="case-overview.html">案件總覽</a>
        <a class="account-menu-item" href="00-login.html">登出</a>
      </div>
    </div>
  </header>

  <div class="shell">

    <div class="stepper" aria-label="投保流程階段">
      <div class="step done"><div class="circle">✓</div><div class="label">險種選擇</div></div>
      <div class="step-line done"></div>
      <div class="step done"><div class="circle">✓</div><div class="label">車輛資料</div></div>
      <div class="step-line done"></div>
      <div class="step done"><div class="circle">✓</div><div class="label">被保險人資料</div></div>
      <div class="step-line done"></div>
      <div class="step done"><div class="circle">✓</div><div class="label">要保人資料</div></div>
      <div class="step-line done"></div>
      <div class="step current"><div class="circle">5</div><div class="label">KYC 及其他</div></div>
      <div class="step-line"></div>
      <div class="step todo"><div class="circle">6</div><div class="label">審查與下載</div></div>
    </div>

    <div class="stage-card">
    <div class="stage-title">
      <h1><span style="font-family:'Roboto',sans-serif;">5.</span> KYC 及其他</h1>
      <p>以下欄位皆為選填，可視實際情況補充後送出投保。</p>
    </div>

    <div class="form-section">
      <h3>保險費來源</h3>
      <div class="field" style="max-width:280px;">
        <label>保險費來源</label>
        <select id="premSource">
          <option value="薪資" selected>薪資</option>
          <option value="投資收入">投資收入</option>
          <option value="退休金">退休金</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>

    <div class="form-section">
      <h3>附件</h3>
      <div class="attach-grid">
        <div class="file-dropzone" id="attachLease" data-state="empty" data-filename="長租合約.pdf" data-empty-text="上傳長租合約" onclick="toggleAttach('attachLease')">
          <div class="title">上傳長租合約</div>
        </div>
        <div class="file-dropzone" id="attachInspection" data-state="empty" data-filename="勘車照.jpg" data-empty-text="上傳勘車照" onclick="toggleAttach('attachInspection')">
          <div class="title">上傳勘車照</div>
        </div>
        <div class="file-dropzone" id="attachOther" data-state="empty" data-filename="其他檔案.pdf" data-empty-text="上傳其他檔案" onclick="toggleAttach('attachOther')">
          <div class="title">上傳其他檔案</div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>其他</h3>
      <div class="fields-row">
        <div class="field">
          <label>同業強制證號</label>
          <input type="text" id="xCardId" maxlength="20" placeholder="可不填">
        </div>
        <div class="field">
          <label>受理編號</label>
          <input type="text" id="irouteAccept" placeholder="可不填">
        </div>
      </div>
    </div>
    </div>

    <div id="submitResultMsg" style="margin:16px 2px 0; display:none;"></div>

  </div>

  <div class="page-actions">
    <div class="page-actions-inner">
      <button class="pv-btn outlined" onclick="location.href='04-applicant-data.html'">上一步</button>
      <button class="pv-btn primary" onclick="handleSubmit()">送出投保</button>
    </div>
  </div>

  <script src="../design/header.js"></script>
  <script>
    /* ---- 附件上傳:單純附加/移除,無OCR辨識(長租合約/勘車照/其他檔案皆選填) ---- */
    function toggleAttach(id){
      const el = document.getElementById(id);
      el.dataset.state = (el.dataset.state === 'empty') ? 'attached' : 'empty';
      renderAttach(el);
    }
    function renderAttach(el){
      const state = el.dataset.state, filename = el.dataset.filename, emptyText = el.dataset.emptyText;
      el.classList.toggle('attached', state === 'attached');
      if(state === 'empty'){
        el.innerHTML = '<div class="title">'+emptyText+'</div>';
      } else {
        el.innerHTML = '<div class="title">'+filename+'</div><button class="remove-btn" onclick="event.stopPropagation(); toggleAttach(\''+el.id+'\')" aria-label="移除附件">✕</button>';
      }
    }

    function handleSubmit(){
      const msgEl = document.getElementById('submitResultMsg');
      msgEl.innerHTML = '<span class="pv-tag tag-success"><span class="dot"></span>已送出投保申請</span>';
      msgEl.style.display = 'block';
      setTimeout(function(){ location.href = '06-review-submit.html'; }, 500);
    }
  </script>
</body>
</html>
